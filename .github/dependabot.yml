version: 2
updates:
  # Python lockfiles. After merging a bump, regenerate the other lockfiles so
  # they stay consistent (see CONTRIBUTING.md).
  - package-ecosystem: pip
    directory: /projects
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /projects
    schedule:
      interval: weekly
